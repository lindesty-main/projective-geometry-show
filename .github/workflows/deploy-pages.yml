name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            claude-fable5/package-lock.json
            deepseek-flash/package-lock.json
            deepseek-pro/package-lock.json
            gpt-sol/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Build all sites
        shell: bash
        run: |
          set -euo pipefail

          repository_name="${GITHUB_REPOSITORY#*/}"
          base_path="/${repository_name}"
          mkdir -p _site
          cp pages/index.html _site/index.html
          touch _site/.nojekyll

          for project in claude-fable5 deepseek-flash deepseek-pro gpt-sol; do
            npm --prefix "${project}" ci
            npm --prefix "${project}" run build -- --base="${base_path}/${project}/"
            mkdir -p "_site/${project}"
            cp -a "${project}/dist/." "_site/${project}/"
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
